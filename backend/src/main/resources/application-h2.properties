# =============================================================================
# Campus Quiz Battle - Standalone In-Memory (H2) Profile
# Enable via: --spring.profiles.active=h2
# =============================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api
spring.application.name=campus-quiz-battle

# H2 In-Memory Database for instant zero-config local run
spring.datasource.url=jdbc:h2:mem:campus_quiz_battle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway disabled in standalone in-memory mode
spring.flyway.enabled=false

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000
app.jwt.refresh-token-expiration=604800000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allow-credentials=true

# H2 Console (available at http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
