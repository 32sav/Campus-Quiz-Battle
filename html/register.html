<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campus Quiz Battle</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="bg-dark text-light" style="display: flex; flex-direction: column; min-height: 100vh;">
  <header class="navbar">
    <a href="index.html" class="brand-title">
      <span>⚔️</span> Campus Quiz Battle
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="login.html" class="btn btn-primary">Sign In</a></li>
    </ul>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div style="background: #1e293b; border: 1px solid #334155; border-radius: 1rem; width: 100%; max-width: 480px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.4);">
      <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; text-align: center;">Join the Arena</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem;">Create your campus profile and join games</p>

      <form id="registerForm" onsubmit="event.preventDefault(); window.location.href = 'student-dashboard.html';">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1;">Full Name</label>
          <input type="text" required placeholder="Alex Rivera" style="width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #f8fafc;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1;">University Email</label>
          <input type="email" required placeholder="alex@campus.edu" style="width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #f8fafc;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1;">Department / Major</label>
          <select style="width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #f8fafc;">
            <option>Computer Science & Engineering</option>
            <option>Business Administration</option>
            <option>Medicine & Health Sciences</option>
            <option>Electrical Engineering</option>
            <option>Humanities & Social Sciences</option>
          </select>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1;">Password</label>
          <input type="password" required placeholder="Minimum 8 characters" style="width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #f8fafc;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 600;">Create Account</button>
      </form>

      <div style="margin-top: 1.25rem; text-align: center;">
        <span style="color: #94a3b8; font-size: 0.875rem;">Already have an account? </span>
        <a href="login.html" style="color: #38bdf8; font-weight: 600; font-size: 0.875rem; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
