<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timed Quiz Assessment - Campus Quiz Battle</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="bg-dark text-light">
  <!-- Navbar with Timer -->
  <header class="navbar" style="border-bottom: 2px solid #38bdf8;">
    <a href="student-dashboard.html" class="brand-title">
      <span>⚔️</span> CS-301: Data Structures
    </a>
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 0.5rem; padding: 0.4rem 1rem; display: flex; align-items: center; gap: 0.5rem;">
        <span style="font-size: 0.85rem; color: #cbd5e1;">Time Left:</span>
        <strong id="quizTimer" style="font-size: 1.25rem; font-weight: 700; color: #f87171; font-family: monospace;">10:00</strong>
      </div>
      <a href="student-dashboard.html" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="return confirm('Quit quiz? Current progress will be lost.')">Exit</a>
    </div>
  </header>

  <main class="dashboard-container" style="max-width: 800px; padding-top: 2rem;">
    <!-- Progress Indicator -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <span id="questionProgress" style="font-size: 0.95rem; font-weight: 600; color: #94a3b8;">Question 1 of 5</span>
      <span class="stat-card-badge" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8;">Timed Assessment</span>
    </div>

    <!-- Question Container Box -->
    <div style="background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
      <div id="questionContainer">
        <!-- Rendered by quiz.js -->
      </div>
    </div>

    <!-- Navigation Buttons -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button id="prevBtn" class="btn btn-outline" onclick="QuizEngine.prevQuestion()">← Previous</button>
      <div>
        <button id="nextBtn" class="btn btn-primary" onclick="QuizEngine.nextQuestion()">Next Question →</button>
        <button id="submitBtn" class="btn btn-primary" style="display: none; background: #22c55e; border-color: #22c55e;" onclick="QuizEngine.submitQuiz()">Finish & Submit</button>
      </div>
    </div>

    <!-- Quiz Result Modal -->
    <div id="resultsModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
      <div style="background: #1e293b; border: 1px solid #334155; border-radius: 1rem; width: 90%; max-width: 480px; padding: 2rem; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 0.5rem;">🎉</div>
        <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem;">Quiz Completed!</h2>
        <p id="scoreDetails" style="color: #94a3b8; margin-bottom: 1.5rem;"></p>

        <div style="background: #0f172a; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem;">
          <div style="font-size: 0.9rem; color: #94a3b8; text-transform: uppercase;">Your Final Score</div>
          <div id="scoreValue" style="font-size: 3rem; font-weight: 800; color: #38bdf8;">--</div>
          <span class="stat-card-badge" style="background: rgba(34, 197, 94, 0.2); color: #4ade80;">+100 Points Awarded</span>
        </div>

        <a href="student-dashboard.html" class="btn btn-primary" style="width: 100%; display: block;">Return to Student Arena</a>
      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/quiz.js"></script>
</body>
</html>
