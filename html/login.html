<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Campus Quiz Battle</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="page-wrapper-center">
  <header class="navbar">
    <a href="index.html" class="brand-title">
      <span>⚔️</span> Campus Quiz Battle
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="register.html" class="btn btn-outline">Create Account</a></li>
    </ul>
  </header>

  <main class="auth-main-container">
    <div class="auth-card">
      <h2 class="auth-header-title">Welcome Back</h2>
      <p class="auth-header-sub">Sign in to your university quiz & Mafia account</p>

      <form id="loginForm" onsubmit="event.preventDefault(); window.location.href = 'student-dashboard.html';">
        <div class="form-group">
          <label class="form-label">Campus Email</label>
          <input type="email" class="form-control" required placeholder="student@campus.edu" value="alex.rivera@campus.edu">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" required placeholder="••••••••" value="password123">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">Sign In</button>
      </form>

      <div class="auth-footer">
        <p class="text-muted font-sm">Quick Demo Profiles:</p>
        <div class="auth-footer-links">
          <a href="student-dashboard.html" class="btn btn-outline btn-sm">🎓 Student</a>
          <a href="lorde-dashboard.html" class="btn btn-outline btn-sm">👑 Lorde</a>
          <a href="admin-dashboard.html" class="btn btn-outline btn-sm">🛡️ Admin</a>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
